name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Run manually from the Actions tab to pick up changes to a project repository
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache removed to prevent "lock file not found" error
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      # Projects live in their own repositories and are published under /projects/
      - name: Build AR Collections Dashboard
        run: |
          git clone --depth 1 https://github.com/amila-nandasiri/ar-collections-dashboard "$RUNNER_TEMP/ar-collections"
          cd "$RUNNER_TEMP/ar-collections"
          npm ci
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/dist/projects/ar-collections"
          cp -r dist/. "$GITHUB_WORKSPACE/dist/projects/ar-collections/"
      - name: Build 13-Week Cash Flow Forecast
        run: |
          git clone --depth 1 https://github.com/amila-nandasiri/cash-flow-forecast "$RUNNER_TEMP/cash-flow"
          cd "$RUNNER_TEMP/cash-flow"
          npm ci
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/dist/projects/cash-flow"
          cp -r dist/. "$GITHUB_WORKSPACE/dist/projects/cash-flow/"
      - name: Build IFRS 16 Lease Calculator
        run: |
          git clone --depth 1 https://github.com/amila-nandasiri/ifrs16-lease-calculator "$RUNNER_TEMP/ifrs16"
          cd "$RUNNER_TEMP/ifrs16"
          npm ci
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/dist/projects/ifrs16"
          cp -r dist/. "$GITHUB_WORKSPACE/dist/projects/ifrs16/"
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
